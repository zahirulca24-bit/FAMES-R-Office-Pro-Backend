services:
  - type: web
    name: fames-r-office-pro-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://fames-r-office-pro-frontend.vercel.app,https://fames-r-office-pro-frontend-zahirulca24-1843s-projects.vercel.app,https://fames-r-office-pro-frontend-git-main-zahirulca24-1843s-projects.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: '^https://fames-r-office-pro-frontend(?:-[a-z0-9-]+)*\.vercel\.app$'
      - key: PYTHON_VERSION
        value: 3.12.8
